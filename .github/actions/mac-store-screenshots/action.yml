# Take a repository's Mac App Store screenshots on a hosted Apple silicon
# runner and keep them.
#
# `packaging/macos/shots.sh` is the repository's and says which document and
# which frames; everything around it is the same everywhere, which is what is
# here: running the set once per language and uploading it.
#
# What is *not* here is building the bundle to photograph. That differs by
# repository — the target directory, the binary's name, what has to be
# registered with Launch Services first — and belongs in the workflow, in the
# step before this one.
#
# The frames are of a bundle built from the commit rather than of the Store
# package, because a Store package cannot be launched off the Store: the kernel
# refuses it. Windows has the same gap for the same reason, and the commit is
# what makes them the same application.
#
# ACCESSIBILITY
#
# Sizing and fronting another application's window goes through System Events,
# and clicking and typing go through CGEventPost. Both are gated by TCC
# Accessibility. A hosted runner is trusted for both — measured on Segler's
# workflow rather than assumed, because a refused click is dropped silently and
# the capture then succeeds, so the failure would be a correctly sized
# photograph of the wrong thing.
#
# ONE SET PER LANGUAGE
#
# A listing in two languages needs two sets, and a German listing showing an
# English window is a German listing of somebody else's application. `shots.sh`
# takes `--lang` and writes each set into a subdirectory named as the stores
# name locales, which is the layout `ship <repo> --shots` reads.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

name: Store screenshots, macOS
description: Run packaging/macos/shots.sh once per language and upload what it wrote.

inputs:
  app:
    description: The bundle to photograph, relative to the workspace.
    required: true
  mode:
    description: >
      `reference` takes one plain frame per language, which is what a
      coordinate gets measured off. `full` takes the set.
    required: true
  languages:
    description: >
      Which sets to take, space separated, as `shots.sh --lang` takes them.
      One language is still one subdirectory, so the layout does not change
      when a second is added.
    required: false
    default: en
  args:
    description: Further arguments for shots.sh.
    required: false
    default: ''
  width:
    description: The window width shots.sh asks for, which sets how big the desktop has to be.
    required: false
    default: '1440'
  height:
    description: The window height shots.sh asks for.
    required: false
    default: '900'
  out:
    description: Where shots.sh writes, relative to the workspace.
    required: false
    default: dist/screenshots
  name:
    description: The artifact name.
    required: false
    default: store-screenshots

runs:
  using: composite
  steps:
    # A hosted macOS runner comes up at 1024x768, which cannot hold the
    # 1440x900 window App Store Connect asks for. System Events clamps the
    # resize to what fits, the driver reads the frame back at 924x668 and
    # refuses, and the refusal says nothing about the desktop. Measured
    # 2026-09-17 on macos-15, taking Slipcase Desktop's first set.
    #
    # `displayplacer` is not on the image and comes from Homebrew, which is.
    # The mode is chosen from what the display actually offers rather than
    # asserted, because an image changes and a resolution that is not there is
    # a silent no-op in every tool that sets one.
    - name: The desktop is big enough to photograph a window on
      shell: bash
      env:
        WANT_W: ${{ inputs.width }}
        WANT_H: ${{ inputs.height }}
      run: |
        set -eu
        # `screenshot.sh` puts the window at 100,80, so that plus the frame is
        # what the desktop has to hold.
        need_w=$((WANT_W + 100))
        need_h=$((WANT_H + 80))

        # `displayplacer` is not on the image and comes from Homebrew, which
        # is. It reads the display as well as setting it: `system_profiler`
        # reported no resolution at all for this runner's display, which then
        # crashed the check that was reading it.
        brew list displayplacer >/dev/null 2>&1 || brew install displayplacer
        displayplacer list > /tmp/displays.txt || true
        # Printed whole. What modes a hosted runner's display offers is the
        # question this step exists to answer, and an image changes.
        cat /tmp/displays.txt

        size() {
          displayplacer list 2>/dev/null |
            sed -n 's/^Resolution: \([0-9][0-9]*\)x\([0-9][0-9]*\).*/\1 \2/p' | head -1
        }
        echo "as found: $(size)"

        id=$(sed -n 's/^Persistent screen id: //p' /tmp/displays.txt | head -1)
        # The smallest mode that holds the window, so the frame is the window
        # and not a window in a field of desktop.
        mode=$(sed -n 's/^  mode \([0-9][0-9]*\): res:\([0-9][0-9]*\)x\([0-9][0-9]*\).*/\1 \2 \3/p' /tmp/displays.txt |
          awk -v w="$need_w" -v h="$need_h" '$2 >= w && $3 >= h { print $2 * $3, $1 }' |
          sort -n | head -1 | cut -d' ' -f2)
        if [ -n "${id}" ] && [ -n "${mode}" ]; then
          displayplacer "id:${id} mode:${mode}"
          sleep 2
          echo "after displayplacer: $(size)"
        else
          echo "no mode on this display is at least ${need_w}x${need_h}"
        fi

        got=$(size)
        if [ -z "${got}" ]; then
          echo "::error::mac-store-screenshots: the display would not say what size it is; the list above is what it said"
          exit 1
        fi
        # Split without set -u tripping over an empty read: `got` is two words
        # or the check above has already stopped.
        w=${got%% *}
        h=${got##* }
        if [ "$w" -lt "$need_w" ] || [ "$h" -lt "$need_h" ]; then
          echo "::error::mac-store-screenshots: the desktop is ${w}x${h} and a ${WANT_W}x${WANT_H} window at 100,80 needs ${need_w}x${need_h}"
          exit 1
        fi

    - name: There is a bundle to photograph
      shell: bash
      env:
        APP: ${{ inputs.app }}
        MODE: ${{ inputs.mode }}
      run: |
        case "$MODE" in
          reference|full) ;;
          *) echo "::error::mac-store-screenshots: mode is reference or full, not '${MODE}'"; exit 1 ;;
        esac
        if [ ! -d "$APP" ]; then
          echo "::error::mac-store-screenshots: no bundle at ${APP}; build it in the step before this one"
          exit 1
        fi
        if [ ! -x packaging/macos/shots.sh ]; then
          echo "::error::mac-store-screenshots: no packaging/macos/shots.sh; the recipes are the repository's half"
          exit 1
        fi

    - name: The Store screenshots
      shell: bash
      env:
        APP: ${{ inputs.app }}
        MODE: ${{ inputs.mode }}
        LANGUAGES: ${{ inputs.languages }}
        EXTRA: ${{ inputs.args }}
        OUT: ${{ inputs.out }}
      run: |
        set -eu
        # Word splitting is wanted here and nowhere else: both are lists.
        # shellcheck disable=SC2086
        for lang in $LANGUAGES; do
          echo "::group::${lang}"
          ref=''
          [ "$MODE" = reference ] && ref=--reference
          ./packaging/macos/shots.sh --app "$APP" --lang "$lang" --outdir "$OUT" ${ref} ${EXTRA}
          echo '::endgroup::'
        done

    - name: Keep them
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.out }}/**/*.png
        if-no-files-found: error
