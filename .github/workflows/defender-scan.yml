name: defender-scan

# Scan a release's Windows artifacts with Microsoft Defender, on a Windows
# runner, and report the detection name. Repos call it rather than copying it:
#
#   jobs:
#     scan:
#       uses: excelano/.github/.github/workflows/defender-scan.yml@main
#       with:
#         tag: ${{ github.event.release.tag_name }}
#
# This exists because of a specific dead end. winget validation flags our
# unsigned binaries as Defender detections from time to time, and clearing a
# false positive requires submitting it to Microsoft, and that submission form
# requires a detection name we had no way to obtain. The name used to be
# readable off the winget validation pipeline run; that route closed on
# 2026-08-10, leaving the moderator as the only source and an unanswered
# question as the only move. Producing the name ourselves at build time removes
# the dependency: a flagged build is known before the manifest is ever
# submitted, and the false-positive submission can go in while the release is
# fresh. See ~/notes/build_release_gotchas.md.
#
# The caller keeps when to run and which tag to scan. How to scan is fleet
# policy and lives here.
on:
  workflow_call:
    inputs:
      tag:
        description: >-
          Release tag whose assets to scan, e.g. v1.9.0. The assets are pulled
          from the calling repository's release, not rebuilt, so what gets
          scanned is the same bytes a user would download and the same bytes a
          winget manifest pins by hash.
        required: true
        type: string
      asset-pattern:
        description: >-
          Glob for which release assets to fetch. Defaults to the Windows
          archives, which are the only ones Defender has an opinion about.
        required: false
        default: "*windows*"
        type: string
      fail-on-detection:
        description: >-
          Whether a detection fails the job. Defaults to false on purpose. A
          detection here is far more often a false positive than a real finding,
          and failing the release build on one would train everybody to ignore
          the red X. The job always writes the detection to the summary either
          way; this input is for callers that would rather stop the line.
        required: false
        default: false
        type: boolean
      dynamic:
        description: >-
          Also run the dynamic pass: turn real-time protection and cloud
          delivery on, then write and execute each binary and read whatever
          Defender says about it. Off by default because it is slower, it
          mutates the runner's security posture, and the static pass covers the
          common case. Turn it on when a detection is known to be firing
          somewhere else and the static pass cannot see it, which is the
          situation that produced this job.
        required: false
        default: false
        type: boolean
      rollback-definitions:
        description: >-
          Before the dynamic pass, roll Defender's signatures back to the
          baseline set shipped with the platform instead of updating to current.
          For chasing a detection that fires somewhere with older definitions
          than yours: if a heuristic was retired between their set and current,
          a machine on current signatures cannot reproduce it and cannot name
          it, and the name is what a false-positive submission requires.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  scan:
    name: Defender scan
    runs-on: windows-latest

    steps:
      - name: Download the release's Windows assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          gh release download '${{ inputs.tag }}' `
            --repo '${{ github.repository }}' `
            --pattern '${{ inputs.asset-pattern }}' `
            --dir artifacts
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed" }
          Get-ChildItem artifacts | Format-Table Name, Length

      # Two things make an on-demand scan quietly meaningless: stale signatures,
      # and an exclusion covering the path being scanned. Both produce a clean
      # result that looks identical to a real one, so both are checked out loud
      # rather than assumed. The runner is administrator, so an exclusion over
      # the workspace can simply be removed.
      - name: Update signatures and confirm the scan can see the workspace
        shell: pwsh
        run: |
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if (-not (Test-Path $mp)) { throw "MpCmdRun.exe not found; this image has no Defender" }

          & $mp -SignatureUpdate | Out-String | Write-Host

          # The hosted Windows image ships with C:\ and D:\ excluded, which is
          # every disk on the runner. An on-demand scan under an exclusion
          # returns 'found no threats' and looks exactly like a real clean
          # result, so this is the difference between a scan and a placebo. The
          # runner is ephemeral and single-tenant, so all exclusions go rather
          # than only the ones covering the workspace: a scan target can move,
          # and a partial strip would fail the same silent way.
          # Get-MpPreference returns $null when nothing is excluded, and @($null)
          # is a one-element array, so the empty case has to be filtered rather
          # than counted or the assertion below fires on success.
          $excl = @((Get-MpPreference).ExclusionPath | Where-Object { $_ })
          if ($excl.Count -gt 0) {
            Write-Host "Removing Defender exclusions: $($excl -join ', ')"
            foreach ($p in $excl) { Remove-MpPreference -ExclusionPath $p }
          }
          $left = @((Get-MpPreference).ExclusionPath | Where-Object { $_ })
          if ($left.Count -gt 0) { throw "exclusions remain, the scan would be meaningless: $($left -join ', ')" }
          Write-Host "Defender exclusions: none"

          $s = Get-MpComputerStatus
          "SIGNATURE_VERSION=$($s.AntivirusSignatureVersion)" | Out-File $env:GITHUB_ENV -Append
          "ENGINE_VERSION=$($s.AMEngineVersion)"             | Out-File $env:GITHUB_ENV -Append
          Write-Host "Signature version: $($s.AntivirusSignatureVersion)"
          Write-Host "Engine version:    $($s.AMEngineVersion)"
          Write-Host "Real-time protection enabled: $($s.RealTimeProtectionEnabled)"

      # winget runs two distinct checks and our flags have only ever landed on
      # the second: '07. Installers Scan' is a static scan of the archive, and
      # '08. Installation Validation' is dynamic testing after install. Every
      # Defender flag so far passed 07 and failed 08, which puts the detection
      # on the extracted executable rather than on the archive. So both are
      # scanned here, and which one trips tells us which artifact a false
      # positive submission has to name.
      - name: Scan archives and extracted executables
        id: scan
        shell: pwsh
        run: |
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          $targets = @()

          foreach ($zip in Get-ChildItem artifacts -Filter *.zip) {
            $targets += [pscustomobject]@{ Kind = 'archive'; Path = $zip.FullName }
            $dest = Join-Path 'extracted' $zip.BaseName
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            try {
              Expand-Archive -LiteralPath $zip.FullName -DestinationPath $dest -Force
            } catch {
              Write-Host "::warning::Could not expand $($zip.Name): $_"
              continue
            }
            foreach ($exe in Get-ChildItem $dest -Recurse -Filter *.exe) {
              $targets += [pscustomobject]@{ Kind = 'executable'; Path = $exe.FullName }
            }
          }

          if ($targets.Count -eq 0) { throw "nothing to scan; check asset-pattern" }

          $results = @()
          foreach ($t in $targets) {
            # Detections are read by diffing the threat-detection history around
            # each scan. There is no supported way to clear that history, so a
            # snapshot before and after is what attributes a detection to the
            # file that caused it rather than to whatever ran earlier.
            $before = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Select-Object -Expand DetectionID)

            # -DisableRemediation matters. Without it Defender quarantines a
            # flagged file mid-run, and every later step fails on a missing file
            # instead of reporting the detection that removed it.
            & $mp -Scan -ScanType 3 -File $t.Path -DisableRemediation | Out-String | Write-Host
            $code = $LASTEXITCODE

            $new = @(Get-MpThreatDetection -ErrorAction SilentlyContinue |
                     Where-Object { $_.DetectionID -notin $before })

            $names = @($new | ForEach-Object {
              $id = $_.ThreatID
              (Get-MpThreat -ErrorAction SilentlyContinue |
                 Where-Object { $_.ThreatID -eq $id } |
                 Select-Object -Expand ThreatName)
            } | Where-Object { $_ } | Sort-Object -Unique)

            $results += [pscustomobject]@{
              Kind      = $t.Kind
              Name      = Split-Path $t.Path -Leaf
              ExitCode  = $code
              Detected  = ($code -eq 2 -or $new.Count -gt 0)
              Threats   = ($names -join ', ')
              Present   = (Test-Path $t.Path)
            }
          }

          $results | Format-Table -AutoSize | Out-String | Write-Host
          $results | ConvertTo-Json -Depth 4 | Out-File scan-results.json -Encoding utf8

          $hits = @($results | Where-Object { $_.Detected })

          $md = @()
          $md += "## Defender scan of ``${{ inputs.tag }}``"
          $md += ""
          $md += "Signature version ``$env:SIGNATURE_VERSION``, engine ``$env:ENGINE_VERSION``."
          $md += ""
          $md += "| Artifact | Kind | Result | Detection name |"
          $md += "| --- | --- | --- | --- |"
          foreach ($r in $results) {
            $verdict = if ($r.Detected) { "**DETECTED**" } else { "clean" }
            $threat  = if ($r.Threats) { "``$($r.Threats)``" } else { "-" }
            $md += "| $($r.Name) | $($r.Kind) | $verdict | $threat |"
          }
          $md += ""
          if ($hits.Count -gt 0) {
            $md += "Submit these as false positives at https://www.microsoft.com/en-us/wdsi/filesubmission"
            $md += "using the Software Developer path, quoting the detection name and signature version above."
          } else {
            $md += "Nothing detected. This is the signature version it was clean against, which is worth"
            $md += "recording: a later flag on the same bytes is a signature change, not a build change."
          }
          $md -join "`n" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          "detected=$($hits.Count -gt 0)"                     | Out-File $env:GITHUB_OUTPUT -Append
          "threat-names=$(($hits.Threats | Sort-Object -Unique) -join ', ')" | Out-File $env:GITHUB_OUTPUT -Append

          foreach ($h in $hits) {
            Write-Host "::warning title=Defender detection::$($h.Name) ($($h.Kind)): $($h.Threats)"
          }

          if ($hits.Count -gt 0 -and '${{ inputs.fail-on-detection }}' -eq 'true') {
            throw "Defender flagged $($hits.Count) artifact(s)"
          }

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defender-scan-${{ inputs.tag }}
          path: scan-results.json
          if-no-files-found: warn

  # The static job above answers 'is there a signature match on this file'. It
  # is not what winget's `08. Installation Validation` asks, and on 2026-08-18
  # the difference was measured rather than assumed: every xfiles v1.9.0 binary
  # scanned clean at signature 1.457.227.0, and xftp 1.9.0 resubmitted the same
  # day on byte-identical bytes was flagged again inside the hour. A clean
  # static scan says nothing about a detection that fires on execution.
  #
  # This job goes after that detection. It turns on the protections the hosted
  # image ships disabled, then writes each binary to disk and runs it, which is
  # the sequence winget performs. The point is the detection NAME: the Microsoft
  # false-positive submission form will not accept a report without one, and
  # since the validation pipeline stopped publishing it there is nowhere else to
  # read it from.
  dynamic:
    name: Defender dynamic
    if: ${{ inputs.dynamic }}
    runs-on: windows-latest

    steps:
      - name: Download the release's Windows assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          gh release download '${{ inputs.tag }}' `
            --repo '${{ github.repository }}' `
            --pattern '${{ inputs.asset-pattern }}' `
            --dir staging
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed" }

      # Extract before protection goes on. Real-time protection acting on the
      # unpack is a detection too, but it would land on the archive and leave
      # nothing on disk to execute, and the executable is the artifact a
      # submission has to name.
      - name: Expand archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path payload | Out-Null
          foreach ($zip in Get-ChildItem staging -Filter *.zip) {
            Expand-Archive -LiteralPath $zip.FullName -DestinationPath (Join-Path 'payload' $zip.BaseName) -Force
          }
          Get-ChildItem payload -Recurse -Filter *.exe | ForEach-Object { $_.FullName }

      # The hosted image ships with real-time protection off, cloud delivery
      # unset and both disks excluded. Every one of those turns this job into a
      # no-op that reports success, so each is set explicitly and then read back
      # — a Set-MpPreference that silently fails under tamper protection would
      # otherwise be indistinguishable from a clean result.
      - name: Arm Defender
        shell: pwsh
        run: |
          $excl = @((Get-MpPreference).ExclusionPath | Where-Object { $_ })
          foreach ($p in $excl) { Remove-MpPreference -ExclusionPath $p }

          Set-MpPreference -DisableRealtimeMonitoring $false
          Set-MpPreference -DisableBehaviorMonitoring $false
          Set-MpPreference -DisableIOAVProtection $false
          Set-MpPreference -DisableScriptScanning $false
          Set-MpPreference -DisableBlockAtFirstSeen $false
          # The July detection carried the !cl suffix, meaning cloud-delivered.
          # Without MAPS reporting and sample consent that class cannot fire at
          # all, so this is the setting the whole job depends on.
          Set-MpPreference -MAPSReporting Advanced
          Set-MpPreference -SubmitSamplesConsent SendAllSamples

          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if ('${{ inputs.rollback-definitions }}' -eq 'true') {
            # -RemoveDefinitions -All drops back to the signature set built into
            # the installed platform. Nothing re-updates afterwards, so the pass
            # runs against that older set, and the version reported below says
            # which one it was.
            Write-Host "Rolling definitions back to the platform baseline"
            & $mp -RemoveDefinitions -All | Out-String | Write-Host
            Set-MpPreference -SignatureScheduleDay Never -ErrorAction SilentlyContinue
          } else {
            & $mp -SignatureUpdate | Out-String | Write-Host
          }

          $s = Get-MpComputerStatus
          $p = Get-MpPreference
          Write-Host "Real-time protection : $($s.RealTimeProtectionEnabled)"
          Write-Host "Behaviour monitoring : $($s.BehaviorMonitorEnabled)"
          Write-Host "Cloud (MAPS)         : $($p.MAPSReporting)"
          Write-Host "Sample submission    : $($p.SubmitSamplesConsent)"
          Write-Host "Signature version    : $($s.AntivirusSignatureVersion)"
          "SIGNATURE_VERSION=$($s.AntivirusSignatureVersion)" | Out-File $env:GITHUB_ENV -Append

          if (-not $s.RealTimeProtectionEnabled) {
            throw "real-time protection did not come on; this job cannot answer the question it was run to answer"
          }
          $left = @((Get-MpPreference).ExclusionPath | Where-Object { $_ })
          if ($left.Count -gt 0) { throw "exclusions remain: $($left -join ', ')" }

      - name: Write and execute each binary under protection
        id: run
        shell: pwsh
        run: |
          # Detections are read from the Defender operational log rather than
          # from Get-MpThreatDetection. Real-time blocks land there as event
          # 1116 with the threat name attached, and the log carries a timestamp,
          # so a detection can be tied to the binary that triggered it.
          $t0 = Get-Date
          New-Item -ItemType Directory -Force -Path live | Out-Null
          $results = @()

          foreach ($exe in Get-ChildItem payload -Recurse -Filter *.exe) {
            $name = $exe.Name
            $dest = Join-Path (Resolve-Path 'live') $name
            $copied = $true
            try {
              # The copy is itself a test: with on-access protection armed, a
              # flagged binary is often taken here, before anything runs.
              Copy-Item $exe.FullName $dest -Force -ErrorAction Stop
            } catch {
              $copied = $false
              Write-Host "::warning::Copy of $name was blocked: $_"
            }

            $ran = $false
            if ($copied -and (Test-Path $dest)) {
              try {
                # --version over --help: it is the cheapest argument that exits
                # on its own, and a CLI waiting on stdin would hang the job.
                $proc = Start-Process -FilePath $dest -ArgumentList '--version' `
                          -PassThru -NoNewWindow -RedirectStandardOutput "$dest.out" -RedirectStandardError "$dest.err"
                $ran = $proc.WaitForExit(30000)
                if (-not $ran) { $proc.Kill() }
              } catch {
                Write-Host "::warning::Execution of $name was blocked: $_"
              }
            }

            Start-Sleep -Seconds 5
            $results += [pscustomobject]@{
              Name = $name; Copied = $copied; Ran = $ran; StillOnDisk = (Test-Path $dest)
            }
          }

          $results | Format-Table -AutoSize | Out-String | Write-Host

          $events = @()
          try {
            $events = Get-WinEvent -LogName 'Microsoft-Windows-Windows Defender/Operational' `
                        -ErrorAction Stop |
                      Where-Object { $_.TimeCreated -ge $t0 -and $_.Id -in 1006,1015,1116,1117 }
          } catch {
            Write-Host "No Defender operational events readable: $_"
          }

          $threats = @(Get-MpThreat -ErrorAction SilentlyContinue |
                       Select-Object -Expand ThreatName -ErrorAction SilentlyContinue) +
                     @($events | ForEach-Object {
                        if ($_.Message -match '(?m)^Name:\s*(.+)$') { $Matches[1].Trim() }
                      })
          $threats = @($threats | Where-Object { $_ } | Sort-Object -Unique)

          $md = @()
          $md += "## Defender dynamic pass — ``${{ inputs.tag }}``"
          $md += ""
          $md += "Signature version ``$env:SIGNATURE_VERSION``, real-time protection on, cloud delivery Advanced."
          $md += ""
          $md += "| Binary | Copied | Ran | Still on disk |"
          $md += "| --- | --- | --- | --- |"
          foreach ($r in $results) { $md += "| $($r.Name) | $($r.Copied) | $($r.Ran) | $($r.StillOnDisk) |" }
          $md += ""
          if ($threats.Count -gt 0) {
            $md += "### Detection names"
            $md += ""
            foreach ($t in $threats) { $md += "- ``$t``" }
            $md += ""
            $md += "Use these on the submission form at https://www.microsoft.com/en-us/wdsi/filesubmission"
            $md += "together with the signature version above."
          } else {
            $md += "No detection fired. Real-time protection and cloud delivery were both confirmed on,"
            $md += "so this is a real negative for these bytes at this signature version — not an unarmed scan."
          }
          if ($events.Count -gt 0) {
            $md += ""
            $md += "<details><summary>Defender operational events</summary>"
            $md += ""
            $md += '```'
            foreach ($e in $events) { $md += "$($e.TimeCreated) [$($e.Id)]"; $md += $e.Message }
            $md += '```'
            $md += ""
            $md += "</details>"
          }
          $md -join "`n" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          [pscustomobject]@{
            SignatureVersion = $env:SIGNATURE_VERSION
            Results = $results
            ThreatNames = $threats
            Events = @($events | ForEach-Object { @{ Time = "$($_.TimeCreated)"; Id = $_.Id; Message = $_.Message } })
          } | ConvertTo-Json -Depth 6 | Out-File dynamic-results.json -Encoding utf8

          foreach ($t in $threats) { Write-Host "::warning title=Detection name::$t" }

      - name: Upload dynamic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defender-dynamic-${{ inputs.tag }}
          path: dynamic-results.json
          if-no-files-found: warn

  # The check that matters. Everything above scans or executes a file; this
  # installs the package the way winget's `08. Installation Validation` does —
  # nested-portable unpack into WinGet\Packages, a shim in WinGet\Links, then
  # run it through the shim. On 2026-08-18 that sequence was the only local
  # reproduction of step 08 available, and it had to be done by hand on a VM.
  # This is that, without the VM.
  #
  # The manifests are synthesised rather than fetched. A local manifest install
  # consults no source, so the identifier only has to be well formed and
  # consistent across the three files — which means this needs no per-repo
  # configuration and no token, and it works before a PR exists, which is the
  # point of running it before submitting.
  winget-install:
    name: winget install validation
    runs-on: windows-latest

    steps:
      - name: Download the release's Windows assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          gh release download '${{ inputs.tag }}' `
            --repo '${{ github.repository }}' `
            --pattern '${{ inputs.asset-pattern }}' `
            --dir artifacts
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed" }

      # The hosted image ships with the disks excluded from Defender, so
      # everything below would pass under an exclusion and prove nothing.
      - name: Arm Defender
        shell: pwsh
        run: |
          $excl = @((Get-MpPreference).ExclusionPath | Where-Object { $_ })
          foreach ($e in $excl) { Remove-MpPreference -ExclusionPath $e }
          Set-MpPreference -DisableRealtimeMonitoring $false
          Set-MpPreference -DisableBehaviorMonitoring $false
          Set-MpPreference -DisableIOAVProtection $false
          Set-MpPreference -DisableBlockAtFirstSeen $false
          Set-MpPreference -MAPSReporting Advanced
          Set-MpPreference -SubmitSamplesConsent SendAllSamples
          & (Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe') -SignatureUpdate | Out-String | Write-Host

          $st = Get-MpComputerStatus
          "SIGNATURE_VERSION=$($st.AntivirusSignatureVersion)" | Out-File $env:GITHUB_ENV -Append
          Write-Host "Real-time protection: $($st.RealTimeProtectionEnabled)  signature: $($st.AntivirusSignatureVersion)"
          if (-not $st.RealTimeProtectionEnabled) { throw "real-time protection did not come on" }
          $left = @((Get-MpPreference).ExclusionPath | Where-Object { $_ })
          if ($left.Count -gt 0) { throw "exclusions remain: $($left -join ', ')" }

      # winget is absent from the Windows Server images. Installing it is three
      # appx packages in dependency order and the runner already has the rights.
      # A failure here stops the job rather than quietly skipping the only check
      # that reproduces step 08.
      - name: Ensure winget is available
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            Write-Host "winget already present"
          } else {
            Write-Host "Installing App Installer and its dependencies"
            Invoke-WebRequest -UseBasicParsing 'https://aka.ms/Microsoft.VCLibs.x64.14.00.Desktop.appx' -OutFile vclibs.appx
            Invoke-WebRequest -UseBasicParsing 'https://github.com/microsoft/microsoft-ui-xaml/releases/download/v2.8.6/Microsoft.UI.Xaml.2.8.x64.appx' -OutFile xaml.appx
            Invoke-WebRequest -UseBasicParsing 'https://aka.ms/getwinget' -OutFile winget.msixbundle
            Add-AppxPackage vclibs.appx
            Add-AppxPackage xaml.appx
            Add-AppxPackage winget.msixbundle
            "$env:LOCALAPPDATA\Microsoft\WindowsApps" | Out-File $env:GITHUB_PATH -Append
            $env:PATH = "$env:LOCALAPPDATA\Microsoft\WindowsApps;$env:PATH"
          }
          winget --version
          if ($LASTEXITCODE -ne 0) { throw "winget is not usable on this runner" }
          winget settings --enable LocalManifestFiles

      - name: Synthesise a manifest per archive and install it
        shell: pwsh
        run: |
          $t0 = Get-Date
          $version = '${{ inputs.tag }}' -replace '^v',''
          $results = @()

          foreach ($zip in Get-ChildItem artifacts -Filter *.zip) {
            # RelativeFilePath has to match where the exe actually sits inside
            # the archive, so it is read from the archive rather than assumed.
            $peek = Join-Path 'peek' $zip.BaseName
            New-Item -ItemType Directory -Force -Path $peek | Out-Null
            Expand-Archive -LiteralPath $zip.FullName -DestinationPath $peek -Force
            $exe = Get-ChildItem $peek -Recurse -Filter *.exe | Select-Object -First 1
            if (-not $exe) { Write-Host "::warning::no exe in $($zip.Name), skipping"; continue }
            $rel = $exe.FullName.Substring((Resolve-Path $peek).Path.Length + 1)

            $name = $exe.BaseName
            $id   = "Local.$name"
            $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash
            $url  = "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/$($zip.Name)"
            $dir  = Join-Path 'manifests' $name
            New-Item -ItemType Directory -Force -Path $dir | Out-Null

            # Built as string arrays rather than here-strings: a PowerShell
            # here-string has to close at column zero, which cannot survive
            # inside an indented YAML block.
            $v = @(
              "PackageIdentifier: $id"
              "PackageVersion: $version"
              "DefaultLocale: en-US"
              "ManifestType: version"
              "ManifestVersion: 1.6.0"
            )
            $l = @(
              "PackageIdentifier: $id"
              "PackageVersion: $version"
              "PackageLocale: en-US"
              "Publisher: Local"
              "PackageName: $name"
              "License: See repository"
              "ShortDescription: Local install validation for Defender"
              "ManifestType: defaultLocale"
              "ManifestVersion: 1.6.0"
            )
            $i = @(
              "PackageIdentifier: $id"
              "PackageVersion: $version"
              "InstallerType: zip"
              "NestedInstallerType: portable"
              "NestedInstallerFiles:"
              "- RelativeFilePath: $rel"
              "Installers:"
              "- Architecture: x64"
              "  InstallerUrl: $url"
              "  InstallerSha256: $hash"
              "ManifestType: installer"
              "ManifestVersion: 1.6.0"
            )
            $v -join "`n" | Set-Content (Join-Path $dir "$id.yaml") -Encoding utf8
            $l -join "`n" | Set-Content (Join-Path $dir "$id.locale.en-US.yaml") -Encoding utf8
            $i -join "`n" | Set-Content (Join-Path $dir "$id.installer.yaml") -Encoding utf8

            Write-Host "=== winget install --manifest ($($zip.Name)) ==="
            winget install --manifest $dir --accept-package-agreements --accept-source-agreements --disable-interactivity
            $code = $LASTEXITCODE

            $shim = Join-Path "$env:LOCALAPPDATA\Microsoft\WinGet\Links" "$name.exe"
            $ran = $false
            if (Test-Path $shim) {
              try { & $shim --version | Out-String | Write-Host; $ran = ($LASTEXITCODE -eq 0) }
              catch { Write-Host "::warning::running $name through the shim was blocked: $_" }
            }

            $results += [pscustomobject]@{
              Package = $name; InstallExit = $code; ShimPresent = (Test-Path $shim); RanViaShim = $ran
            }
          }

          Start-Sleep -Seconds 10
          $results | Format-Table -AutoSize | Out-String | Write-Host

          $named = @(Get-MpThreat -ErrorAction SilentlyContinue | Select-Object -Expand ThreatName -ErrorAction SilentlyContinue)
          $events = @()
          try {
            $events = Get-WinEvent -LogName 'Microsoft-Windows-Windows Defender/Operational' -ErrorAction Stop |
                      Where-Object { $_.TimeCreated -ge $t0 -and $_.Id -in 1006,1015,1116,1117 }
            $named += @($events | ForEach-Object { if ($_.Message -match '(?m)^Name:\s*(.+)$') { $Matches[1].Trim() } })
          } catch { Write-Host "no Defender operational events readable" }
          $named = @($named | Where-Object { $_ } | Sort-Object -Unique)

          $failed = @($results | Where-Object { $_.InstallExit -ne 0 -or -not $_.RanViaShim })

          $md = @()
          $md += "## winget install validation"
          $md += ""
          $md += "Defender armed, signature ``$env:SIGNATURE_VERSION``. Installed through winget the way step 08 does."
          $md += ""
          $md += "| Package | winget exit | Shim created | Ran via shim |"
          $md += "| --- | --- | --- | --- |"
          foreach ($r in $results) { $md += "| $($r.Package) | $($r.InstallExit) | $($r.ShimPresent) | $($r.RanViaShim) |" }
          $md += ""
          if ($named.Count -gt 0) {
            $md += "### Detection names"
            foreach ($n in $named) { $md += "- ``$n``" }
            $md += ""
            $md += "Submit at https://www.microsoft.com/en-us/wdsi/filesubmission with the signature version above."
          } elseif ($failed.Count -gt 0) {
            $md += "**$($failed.Count) package(s) failed to install or run with no Defender detection recorded.** That is a packaging problem rather than a false positive."
          } else {
            $md += "All packages installed and ran clean. This reproduces winget's step 08 and is the strongest pre-submission signal available, though not a guarantee — the validation fleet has been observed running older definitions than a current runner."
          }
          $md -join "`n" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          [pscustomobject]@{ SignatureVersion = $env:SIGNATURE_VERSION; Results = $results; ThreatNames = $named } |
            ConvertTo-Json -Depth 5 | Out-File winget-install-results.json -Encoding utf8

          foreach ($n in $named)  { Write-Host "::warning title=Detection name::$n" }
          foreach ($f in $failed) { Write-Host "::warning title=Install failed::$($f.Package) exit=$($f.InstallExit)" }

          if ($named.Count -gt 0 -and '${{ inputs.fail-on-detection }}' -eq 'true') {
            throw "Defender flagged $($named.Count) package(s) during winget install"
          }

      - name: Upload winget install results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winget-install-${{ inputs.tag }}
          path: winget-install-results.json
          if-no-files-found: warn
