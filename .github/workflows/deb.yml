name: deb

# Build the Debian packages for a release, prove they run, and attach them.
#
# One copy for the fleet. This was seven near-identical files — five of them
# byte-identical, one differing in a help string and one in a `-p` flag — and
# the smoke test below is the reason to collapse them: a check worth having on
# one repo is worth having on all seven, and nobody adds it seven times.
#
# The caller decides when to run; this decides what to do. See the callers'
# `deb.yml`, which is a few lines naming this file.
#
# On the trigger: cargo-dist creates the release with the default
# GITHUB_TOKEN, and GitHub does not fire `release: published` for a release a
# token created — a documented safeguard against workflow recursion. So in
# practice the caller is dispatched by hand after a cargo-dist release:
#
#     gh workflow run deb.yml -f tag=v1.2.3
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

on:
  workflow_call:
    inputs:
      tag:
        description: 'The tag to build packages for'
        required: true
        type: string
      package:
        description: 'The workspace package to build, where the repository is a workspace and only one of its members ships a binary'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Build and check, attach nothing'
        required: false
        type: boolean
        default: false
      fleet_apt:
        description: 'Add the Excelano apt source before installing, for a package that depends on another of the fleet'
        required: false
        type: boolean
        default: false
      commands:
        description: 'The commands the package installs, where they are not the ship.conf commands: a second package from one repository, whose command ship.conf cannot name because its commands name the Homebrew formulas'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      # What to run comes from the repo's ship.conf, which is where that fact
      # already lives and is read by ship and fleet too. Passing it as an input
      # would have put it in the caller as well, and a value in two files is a
      # value that disagrees with itself eventually.
      #
      # The file was called release.conf until it was renamed on 2026-09-09,
      # and this line went on reading the old name, so the fallback below took
      # over everywhere.
      #
      # Only the new name is read. A second read of the old one was here
      # briefly, on the reasoning that this job checks out the tag and a tag
      # older than the rename would carry a tree with the old name in it. No
      # tag of any caller does: `release.conf` was added to each of them after
      # its newest tag, so the tag's tree has neither file and the fallback
      # below is what actually answers for every tag that exists today. That
      # is right for every caller but paxc, whose `commands=paxc paxr` first
      # reaches a tagged tree at its next release; until then `paxr` goes
      # untested, as it has all along.
      #
      # A caller building a second package names that package's commands
      # itself. plene ships the CLI and a window as two packages from one repo;
      # ship.conf's `commands` names the Homebrew formulas, and the tap carries
      # the CLI only, so the window's command cannot be listed there.
      - name: What the packages install
        id: what
        env:
          COMMANDS: ${{ inputs.commands }}
        run: |
          set -eu
          commands=$COMMANDS
          [ -n "$commands" ] || commands=$(sed -n 's/^commands=//p' ship.conf 2>/dev/null || true)
          [ -n "$commands" ] || commands="${GITHUB_REPOSITORY#*/}"
          echo "commands=$commands" >> "$GITHUB_OUTPUT"

      - name: Build the package
        run: cargo deb ${{ inputs.package && format('-p {0}', inputs.package) || '' }}

      # Each architecture is built on a runner of that architecture rather than
      # cross-compiled, which is what makes this worth asserting: a package
      # labelled arm64 carrying an x86-64 executable installs perfectly and
      # then does not run. Borrowed from comma's, which has had it all along.
      - name: The package is the architecture it claims
        run: |
          package=$(ls target/debian/*.deb)
          test "$(dpkg-deb -f "$package" Architecture)" = "${{ matrix.arch }}"

      # Ownership, modes, and that md5sums is present and correct - the same
      # check every desktop repo's linux.yml already runs. deb.yml predates
      # this composite action (added 9b494f1, long after deb.yml existed)
      # and was simply never updated to use it - not a deliberate omission,
      # confirmed by checking history before adding it here.
      - uses: excelano/.github/.github/actions/linux-package-integrity-check@main
        with:
          deb-glob: target/debian/*.deb

      - uses: excelano/.github/.github/actions/linux-lintian-check@main
        with:
          deb-glob: target/debian/*.deb

      # The step this workflow exists for. Until 2026-09-09 every arm64 package
      # the fleet published was compiled here and shipped without anything
      # running it once: this job built it and uploaded it, CI ran on amd64
      # only, and no machine in the house is arm64 — the Pi is 32-bit and the
      # Mac is Intel. The runner is real arm64 hardware and is thrown away
      # afterwards, so asking it to install the package and run the command
      # costs seconds and is the only execution the artefact will ever get.
      #
      # Install through apt rather than `dpkg -i`, so a missing dependency is
      # resolved and reported rather than leaving a half-configured package.
      # A package whose Depends names another of the fleet's is not installable
      # from Ubuntu's sources alone, and `apt-get install ./x.deb` refuses it
      # rather than reporting a missing dependency: slipcase-desktop declares
      # `Depends: slipcase-common`, and that is what it refused on, on both
      # architectures. The source is added here rather than the dependency
      # installed by name, so that apt resolves whatever the package declares.
      #
      # Off by default. A repository whose packages depend only on the
      # distribution's is better off proving that they do.
      - name: The Excelano apt source
        if: ${{ inputs.fleet_apt }}
        run: curl -fsSL https://excelano.com/apt/setup.sh | sudo sh

      - name: apt-get update
        run: sudo apt-get update

      - uses: excelano/.github/.github/actions/linux-install-check@main
        with:
          deb-glob: target/debian/*.deb
          binaries: ${{ steps.what.outputs.commands }}

      # The build leaves this job here; whether it goes any further is the
      # attach job below, which is where dry_run and the idempotency check
      # both live now.
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: target/debian/*.deb

  # Only real work when dry_run is false. Separated from the build matrix so
  # both architectures' packages are attached together rather than racing
  # each other's `gh release upload` calls, and so the idempotency check
  # (safe to run twice: skip a byte-identical re-attach, refuse a differing
  # one) lives in one place - the same composite action the desktop repos'
  # linux.yml already calls.
  attach:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: excelano/.github/.github/actions/linux-attach-release-packages@main
        with:
          tag: ${{ inputs.tag }}
