name: deb-smoke

# Install the arm64 packages a release published, and run what they installed.
#
# For the repositories whose packages are cross-compiled. goreleaser builds
# every architecture on one amd64 runner, so nothing arm64 executes anywhere in
# that release — the binary is written, packaged, signed for and shipped
# without being run. This is the first arm64 machine the artefact ever meets,
# and it meets it before anybody installs it from apt.
#
# The Rust repositories build each package on a runner of its own architecture
# and smoke it in the same job; see `deb.yml` beside this file. They do not
# need this one.
#
# It reads the packages off the release rather than rebuilding them, which is
# what makes it a test of the artefact: the bytes it installs are the bytes a
# person installs.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

# Dispatchable as well as callable, and deliberately: this job only reads —
# it downloads a release's packages and installs them on a runner that is
# discarded afterwards, writing nothing anywhere. So it can be pointed at any
# release that has already shipped, which is the only way to find out whether
# the arm64 packages already in apt run, without cutting a release to ask.
on:
  workflow_call:
    inputs:
      tag:
        description: 'The release whose packages to install'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release whose packages to install (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      # The default branch, not the tag. This checkout is here for
      # ship.conf alone — the packages come off the release — and the
      # current profile is the one that is right about what this repo installs.
      # Pinning it to the tag would read a profile that, for every release
      # shipped before 2026-09-09, is not in the tree at all: the fallback
      # would take over and run the repository name, which is not a command
      # xfiles installs.
      - uses: actions/checkout@v6

      # What to run comes from the repo's ship.conf, which is where that fact
      # already lives and is read by ship and fleet too. Passing it as an input
      # would have put it in the caller as well, and a value in two files is a
      # value that disagrees with itself eventually.
      #
      # The file was called release.conf until it was renamed on 2026-09-09,
      # and this line went on reading the old name. So the fallback below took
      # over everywhere: blick-cli and xfiles install no command by their
      # repository's name and would have failed here, paxc installs two and
      # only the first was checked, and the repositories it appeared to work
      # for were the ones whose command is named after the repository anyway.
      # There is no release.conf to fall back to, because the checkout above is
      # of the default branch rather than the tag.
      - name: What the packages install
        id: what
        run: |
          set -eu
          commands=$(sed -n 's/^commands=//p' ship.conf 2>/dev/null || true)
          [ -n "$commands" ] || commands="${GITHUB_REPOSITORY#*/}"
          echo "commands=$commands" >> "$GITHUB_OUTPUT"

      - name: Take the arm64 packages off the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern '*_arm64.deb'

      # A repository that ships several commands ships several packages, and
      # downloading none of them is not a failure `gh release download` reports
      # in a way this job would otherwise notice. Counted rather than assumed.
      - name: There is something to install
        run: |
          set -eu
          count=$(ls -1 ./*_arm64.deb 2>/dev/null | wc -l)
          echo "$count arm64 packages"
          test "$count" -gt 0

      - name: They install, and what they installed runs
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y ./*_arm64.deb
          for c in ${{ steps.what.outputs.commands }}; do
              command -v "$c"
              "$c" --version
          done
