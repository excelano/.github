name: dependabot-merge

# Merge a Dependabot PR once every workflow on its commit is green. Called
# from each repo on check_suite completion, so whichever run finishes last
# does the merge.
on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ inputs.sha }}
        run: |
          set -eu
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefOid,author \
               --jq ".[] | select(.headRefOid == \"$SHA\" and .author.login == \"app/dependabot\") | .number" | head -1)
          [ -n "$pr" ] || { echo "no open Dependabot PR at $SHA"; exit 0; }
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$SHA" --json status,conclusion,name \
                 --jq '[.[] | select(.name != "dependabot-merge")]')
          echo "$runs" | jq -r '.[] | "\(.name): \(.status) \(.conclusion)"'
          echo "$runs" | jq -e 'length > 0 and all(.status == "completed" and (.conclusion == "success" or .conclusion == "skipped"))' >/dev/null \
            || { echo "not every run on $SHA is green yet"; exit 0; }
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
